# Live knowledge retrieval guardrails and toggles.

enable_live_retrieval: false

# Per-dialogue cap on distinct search queries (entity-driven).
max_live_queries_per_dialogue: 6

# Hard ceiling on search + LLM API calls per pipeline run (prevents runaway cost).
max_api_calls_per_run: 100

# Reuse cached search results within this window (days).
cache_ttl_days: 30

# Allowlisted results fetched per query.
results_per_query: 5

# Search backend: tavily (default) or serpapi
search_provider: tavily

# How to turn search hits into live_api sentences.
# extractive = local sentence selection from page/snippet (no Groq quota).
# llm = Groq/OpenAI summarization; falls back to extractive on 429/errors.
summarize_backend: extractive

# LLM used for live page summarization (OpenAI-compatible API).

llm_model: qwen2.5:3b-instruct
llm_api_base: http://localhost:11434/v1

# Estimated USD cost per dialogue at default limits (for planning; update if pricing changes).
estimated_cost_per_dialogue_usd: 0.03

# Page fetch timeout in seconds (indiacode.nic.in and similar often stall).
page_fetch_timeout: 8

# Tavily/SerpAPI HTTP timeout in seconds.
search_timeout: 10

# Skip re-fetching URLs that failed recently (timeouts, 4xx/5xx, connection errors).
failure_cache_ttl_days: 1

# Concurrent page fetches within one query's result set.
max_concurrent_fetches: 4

# Concurrent search queries within one turn.
max_concurrent_queries: 3

# Hard wall-clock cap for live retrieval on one dialogue turn (seconds).
max_live_retrieval_seconds: 20

# Top live-page sentences kept per URL by SBERT cosine (usable even if OpenIE extracts nothing).
live_sentence_candidates_per_page: 8
# Deprecated alias; live_sentence_candidates_per_page wins when both are set.
live_sentence_top_k: 8
